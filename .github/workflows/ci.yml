name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format / tokens
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml の channel だけを使う。RUSTUP_TOOLCHAIN を立てると rustup はファイルの
      # components / targets を無視するので、CI ではジョブごとに setup-rust で指定したものだけが入る。
      - name: Pin toolchain
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          components: rustfmt
          cache: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Format
        run: cargo fmt --all --check

      # check-tokens の実行でも cargo がワークスペース全体の依存（zed などの git 依存）を取得するので、
      # ~/.cargo だけをキャッシュする（xtask は std だけなので target は要らない）。
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: fmt
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # docs/TOKENS_SOURCE.md と md3-tokens の定数の突き合わせ。xtask は std だけなのでシステム依存なしで動く。
      - name: Check tokens
        run: cargo run --locked -p xtask -- check-tokens

  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # gpui の Linux バックエンド（wayland / x11 / wgpu / font-kit）が要求するシステムライブラリ。
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libvulkan-dev libssl-dev

      - name: Pin toolchain
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_ENV"

      # moonrepo/setup-rust のキャッシュは使わない。cache-base を指定するとキーに Cargo.lock が入らず、
      # 最初に保存したキャッシュが更新されないうえ、~/.cargo/git（zed などの git 依存）を含まず毎回取り直すため。
      - name: Setup Rust
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          components: clippy
          cache: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ~/.cargo（registry と git）と target を、Cargo.lock を含むキーでキャッシュする。保存は main でだけ行い、
      # 他のブランチは main のものを復元する。
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  wasm:
    name: Build (wasm32-unknown-unknown)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pin toolchain
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_ENV"

      # moonrepo/setup-rust のキャッシュは target/debug だけで target/wasm32-unknown-unknown を含まないため、
      # このジョブでは無効にして Swatinem/rust-cache を使う。
      - name: Setup Rust
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          targets: wasm32-unknown-unknown
          cache: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build md3-components
        run: cargo build -p md3-components --target wasm32-unknown-unknown --locked

      - name: Build examples
        run: cargo build -p gallery -p mail-sample --target wasm32-unknown-unknown --locked

  # ブランチ保護の必須チェックにはこのジョブだけを指定する。
  ci:
    name: CI
    if: always()
    needs:
      - fmt
      - check
      - wasm
    runs-on: ubuntu-24.04

    steps:
      - name: Decide whether all jobs succeeded
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJson(needs) }}
