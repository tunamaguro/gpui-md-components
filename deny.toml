[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]

# gpui の間接依存。MPL-2.0 はこの 3 つに限って認める（新しい MPL の依存が入ったら気づけるように）。
[[licenses.exceptions]]
crate = "dwrote"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "cbindgen"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]
