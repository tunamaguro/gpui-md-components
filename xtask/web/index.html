<!doctype html>
<!-- `cargo xtask web` が target/web/ に置く、見本を選ぶページ。 -->
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>md3 examples</title>
        <style>
            :root {
                color-scheme: light dark;
                --background: #fef7ff;
                --on-background: #1d1b20;
                --on-surface-variant: #49454f;
                --outline: #cac4d0;
                --primary: #6750a4;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --background: #141218;
                    --on-background: #e6e0e9;
                    --on-surface-variant: #cac4d0;
                    --outline: #49454f;
                    --primary: #d0bcff;
                }
            }
            body {
                margin: 0 auto;
                max-width: 40rem;
                padding: 3rem 1rem;
                background: var(--background);
                color: var(--on-background);
                font-family: system-ui, sans-serif;
                line-height: 1.5;
            }
            h1 {
                margin: 0 0 1.5rem;
                font-size: 2rem;
                font-weight: 400;
            }
            ul {
                display: grid;
                gap: 0.75rem;
                margin: 0;
                padding: 0;
                list-style: none;
            }
            a {
                display: grid;
                gap: 0.25rem;
                padding: 1rem;
                border: 1px solid var(--outline);
                border-radius: 12px;
                color: inherit;
                text-decoration: none;
            }
            a:hover {
                border-color: var(--primary);
            }
            a:focus-visible {
                outline: 3px solid var(--primary);
                outline-offset: 2px;
            }
            strong {
                font-weight: 500;
            }
            span {
                color: var(--on-surface-variant);
            }
        </style>
    </head>
    <body>
        <h1>md3 examples</h1>
        <ul>
{{examples}}        </ul>
    </body>
</html>
