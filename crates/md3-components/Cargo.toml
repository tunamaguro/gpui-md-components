[package]
name = "md3-components"
description = "Material Design 3 の仕様に基づく gpui 用 UI コンポーネント。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gpui.workspace = true
gpui_platform = { workspace = true, optional = true }
gpui-headless.workspace = true
md3-icons.workspace = true
md3-theme.workspace = true

[features]
default = ["platform", "button", "switch"]
platform = ["dep:gpui_platform"]
button = []
switch = []

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
