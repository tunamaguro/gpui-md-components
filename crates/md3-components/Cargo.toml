[package]
name = "md3-components"
description = "Material Design 3 の仕様に基づく gpui 用 UI コンポーネント。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gpui.workspace = true
gpui_platform = { workspace = true, optional = true }
gpui-headless.workspace = true
md3-icons.workspace = true
md3-theme.workspace = true

[features]
default = [
  "platform",
  "badge",
  "button",
  "icon-button",
  "app-bar",
  "bottom-app-bar",
  "button-group",
  "connected-button-group",
  "card",
  "checkbox",
  "chip",
  "dialog",
  "divider",
  "fab",
  "list",
  "loading-indicator",
  "menu",
  "navigation-bar",
  "navigation-rail",
  "progress-indicator",
  "radio-button",
  "segmented-button",
  "select",
  "slider",
  "snackbar",
  "split-button",
  "switch",
  "tabs",
  "text-field",
]
platform = ["dep:gpui_platform"]
badge = []
button = []
# 色・大きさ・形の型を Button と共有する
icon-button = ["button"]
# ナビゲーションのアイコンに使う
app-bar = ["icon-button"]
# 操作に置くアイコンボタンと、右端に置く FAB に使う
bottom-app-bar = ["icon-button", "fab"]
button-group = []
connected-button-group = ["button"]
card = []
checkbox = []
chip = []
dialog = []
divider = []
fab = []
list = []
loading-indicator = []
# メニューを開くボタンと、組の中の区切り線を使う
menu = ["button", "divider"]
navigation-bar = []
navigation-rail = []
progress-indicator = []
radio-button = []
segmented-button = []
select = []
slider = []
# 後ろのボタンでメニューを開く
split-button = ["menu"]
# 操作のボタンと閉じるボタンを使う
snackbar = ["icon-button"]
switch = []
tabs = []
text-field = []

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
