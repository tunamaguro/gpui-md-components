[package]
name = "md3-components"
description = "Material Design 3 の仕様に基づく gpui 用 UI コンポーネント。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gpui.workspace = true
md3-icons.workspace = true
md3-theme.workspace = true

[features]
default = ["buttons", "selection", "inputs", "overlays", "navigation", "containment", "expressive"]
# Button, IconButton, FAB, SegmentedButton（M4）
buttons = []
# Checkbox, RadioButton, Switch, Chip, Slider 等（M4）
selection = []
# TextField, Select（M5）、SearchBar（M6）。Select はメニューを使う
inputs = ["overlays"]
# Menu, Dialog, Tooltip, Snackbar, Sheet（M5）。Dialog などはボタンを使う
overlays = ["buttons"]
# TopAppBar, NavigationBar / Rail / Drawer, Tabs（M6）。アプリバーはアイコンボタン、モーダルなドロワーはオーバーレイを使う
navigation = ["overlays"]
# List, Card, Divider（M6）
containment = []
# M3 Expressive の ToggleButton, ButtonGroup（M8）
expressive = []

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
