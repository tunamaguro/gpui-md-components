[package]
name = "md3-components"
description = "Material Design 3 の仕様に基づく gpui 用 UI コンポーネント。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gpui.workspace = true
gpui_platform = { workspace = true, optional = true }
gpui-headless.workspace = true
md3-icons.workspace = true
md3-theme.workspace = true

[features]
default = [
  "platform",
  "button",
  "icon-button",
  "checkbox",
  "divider",
  "radio-button",
  "switch",
]
platform = ["dep:gpui_platform"]
button = []
# 色・大きさ・形の型を Button と共有する
icon-button = ["button"]
checkbox = []
divider = []
radio-button = []
switch = []

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
