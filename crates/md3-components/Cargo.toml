[package]
name = "md3-components"
description = "Material Design 3 の仕様に基づく gpui 用 UI コンポーネント。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gpui.workspace = true
gpui_platform = { workspace = true, optional = true }
gpui-headless.workspace = true
md3-icons.workspace = true
md3-theme.workspace = true

[features]
default = [
  "platform",
  "badge",
  "button",
  "icon-button",
  "card",
  "checkbox",
  "chip",
  "divider",
  "fab",
  "menu",
  "progress-indicator",
  "radio-button",
  "segmented-button",
  "slider",
  "switch",
  "tabs",
]
platform = ["dep:gpui_platform"]
badge = []
button = []
# 色・大きさ・形の型を Button と共有する
icon-button = ["button"]
card = []
checkbox = []
chip = []
divider = []
fab = []
# メニューを開くボタンと、組の中の区切り線を使う
menu = ["button", "divider"]
progress-indicator = []
radio-button = []
segmented-button = []
slider = []
switch = []
tabs = []

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
