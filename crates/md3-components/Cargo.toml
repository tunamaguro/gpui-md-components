[package]
name = "md3-components"
description = "Material Design 3 の仕様に基づく gpui 用 UI コンポーネント。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gpui-headless.workspace = true
gpui.workspace = true
gpui_platform = { workspace = true, optional = true }
md3-icons.workspace = true
md3-theme.workspace = true

[features]
default = [
  "buttons",
  "selection",
  "inputs",
  "overlays",
  "navigation",
  "containment",
  "expressive",
]
# Button, IconButton, FAB, SegmentedButton
buttons = []
# Checkbox, RadioButton, Switch, Chip, Slider 等
selection = []
# TextField, Select、SearchBar。Select はメニューを使う
inputs = ["overlays"]
# Menu, Dialog, Tooltip, Snackbar, Sheet。Dialog などはボタンを使う
overlays = ["buttons"]
# TopAppBar, NavigationBar / Rail / Drawer, Tabs。アプリバーはアイコンボタン、モーダルなドロワーはオーバーレイを使う
navigation = ["overlays"]
# List, Card, Divider
containment = []
# M3 Expressive の ToggleButton, ButtonGroup
expressive = []
# gpui_platform（同じ rev）を再公開する。アプリの起動に使う。既定では無効
platform = ["dep:gpui_platform"]

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
